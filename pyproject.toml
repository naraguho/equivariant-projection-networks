[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equivariant-projection-networks"
version = "0.1.0"
description = "Readable PyTorch examples of exact finite-group equivariance by group averaging"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ho Jang"}]
dependencies = ["numpy>=1.24", "torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["epn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

